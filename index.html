<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kiaa - Cinta Bawa Duka 💔</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,#ff006a 0%,#7a00ff 30%,#000 70%);animation:bgMove 1.2s infinite alternate}
@keyframes bgMove{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(40deg)}}
.container{position:relative;z-index:5;text-align:center;width:100%;max-width:380px;padding:20px}
.photo-frame{width:260px;height:340px;margin:0 auto;border-radius:24px;overflow:hidden;border:3px solid #fff;box-shadow:0 0 20px #ff006a,0 0 50px #ff006a;animation:jedag.32s infinite alternate;position:relative}
.photo-frame img{width:100%;height:100%;object-fit:cover;animation:zoomShake.32s infinite alternate}
@keyframes jedag{0%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(1deg) translateY(-8px)}100%{transform:scale(1.15) rotate(-1deg)}}
@keyframes zoomShake{0%{transform:scale(1.05)}100%{transform:scale(1.18)}}
h1{color:#fff;font-size:42px;font-weight:900;margin-top:14px;text-shadow:0 0 10px #ff006a,0 0 20px #ff006a;animation:textJedag.16s infinite}
@keyframes textJedag{0%{transform:translateX(-2px) skewX(-2deg)}100%{transform:translateX(2px) skewX(2deg)}}
.lyric{color:#ff8fab;font-size:15px;margin-top:4px;font-weight:700;min-height:22px}
.tap{color:#fff;font-size:13px;margin-top:14px;background:rgba(255,255,255,.18);display:inline-block;padding:10px 18px;border-radius:22px;border:1px solid rgba(255,255,255,.4);animation:pulse 1s infinite;cursor:pointer}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.hearts{position:absolute;inset:0;pointer-events:none;z-index:4}
.heart{position:absolute;bottom:-30px;animation:fly linear forwards}
@keyframes fly{0%{transform:translateY(0) translateX(0) rotate(0deg) scale(.6);opacity:1}100%{transform:translateY(-110vh) translateX(var(--x)) rotate(720deg) scale(1.4);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10}
.flash.active{animation:flashBeat.18s}
@keyframes flashBeat{0%{opacity:.55}100%{opacity:0}}
.yt-box{position:fixed;top:-300px;left:10px;right:10px;height:200px;opacity:0;z-index:20;transition:all.5s}
.yt-box.show{top:10px;opacity:1}
</style>
</head>
<body>
<div class="bg"></div>
<div class="flash" id="flash"></div>
<div class="hearts" id="hearts"></div>
<div class="container">
<div class="photo-frame"><img src="kia.jpg" alt="Kiaa"></div>
<h1>KIAA 💔</h1>
<div class="lyric" id="lyric">CINTA BAWA DUKA 🎶</div>
<div class="tap" id="tapBtn">🔊 TAP DISINI BIAR MUSIK NYALA 🔊</div>
</div>
<div class="yt-box" id="ytBox">
<iframe id="ytPlayer" width="100%" height="200" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>
<audio id="music" loop preload="auto" playsinline>
<source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_7c6d782d0f.mp3?filename=good-day-113484.mp3" type="audio/mpeg">
</audio>
<script>
const lyrics=["CINTA BAWA DUKA 🎶","KAU BUAT AKU TERLUKA 💔","CINTA KAU DAN DIA 😭","HANCUR HATIKU 💔","KIAA CANTIK TAPI SEDIH 🥺","RINDU BALAS DENDAM 😭"];
let li=0;const lyricEl=document.getElementById('lyric');
setInterval(()=>{li=(li+1)%lyrics.length; lyricEl.textContent=lyrics[li];},800);
const hearts=document.getElementById('hearts');
function createHeart(){const el=document.createElement('div');el.className='heart';el.textContent=['💔','❤️','😭','💘','🥀'][Math.floor(Math.random()*5)];el.style.left=Math.random()*100+'vw';el.style.setProperty('--x',(Math.random()*120-60)+'px');el.style.fontSize=(20+Math.random()*26)+'px';el.style.animationDuration=(2+Math.random()*1.2)+'s';hearts.appendChild(el);setTimeout(()=>el.remove(),3200);}
setInterval(createHeart,80);
const flash=document.getElementById('flash');setInterval(()=>{flash.classList.remove('active'); void flash.offsetWidth; flash.classList.add('active');},320);
let playing=false;
function startMusic(){if(playing) return; playing=true; document.getElementById('tapBtn').textContent='🎶 CINTA BAWA DUKA PLAYING - KERASIN VOLUME! 🎶'; document.getElementById('tapBtn').style.background='#ff006a'; document.getElementById('music').volume=0.9; document.getElementById('music').play(); document.getElementById('ytBox').classList.add('show'); document.getElementById('ytPlayer').src='https://www.youtube.com/embed/FzG4uDgje3M?autoplay=1&mute=0&loop=1';}
document.body.addEventListener('click',startMusic);
document.getElementById('tapBtn').addEventListener('click',startMusic);
document.body.addEventListener('touchstart',startMusic,{once:true});
</script>
</body>
  </html>
