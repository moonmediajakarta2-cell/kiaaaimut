<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kiaaaimut ♡ JEDAG JEDUG</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@800&display=swap');
body{margin:0;min-height:100vh;background:#000;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;background:linear-gradient(135deg,#ff006e,#8338ec,#3a86ff);animation:hue 5s infinite linear}
@keyframes hue{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
.card{position:relative;z-index:2;background:rgba(0,0,0,.85);padding:22px;border-radius:25px;text-align:center;max-width:380px;width:88%;border:2px solid #ff006e;box-shadow:0 0 40px #ff006e,0 0 80px #8338ec;animation:shake .3s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
h1{font-family:'Pacifico',cursive;color:#fff;font-size:2.5em;margin:0;text-shadow:0 0 10px #ff006e}
.subtitle{color:#ffbe0b;font-weight:800;letter-spacing:2px;animation:blink .5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
img{width:130px;height:130px;border-radius:50%;border:4px solid #ffbe0b;box-shadow:0 0 20px #ffbe0b;object-fit:cover}
.player{margin-top:15px;border-radius:15px;overflow:hidden;border:2px solid #ffbe0b}
iframe{width:100%;height:215px;border:0}
.btn{margin-top:15px;padding:14px;width:100%;background:linear-gradient(90deg,#ff006e,#ffbe0b);font-weight:800;font-size:1.1em;border-radius:50px;border:none}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
<img src="kia.jpg" onerror
