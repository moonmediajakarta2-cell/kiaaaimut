<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kiaa - Cinta Bawa Duka 💔</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,#ff006a 0%,#7a00ff 30%,#000 70%);animation:bgMove 1.2s infinite alternate}
@keyframes bgMove{0%{filter:hue-rotate(0deg) brightness(1)}100%{filter:hue-rotate(40deg) brightness(1.3)}}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,black 90%);z-index:1}
.container{position:relative;z-index:5;text-align:center;width:100%;max-width:380px;padding:20px}
.photo-frame{width:260px;height:340px;margin:0 auto;border-radius:24px;overflow:hidden;border:3px solid #fff;box-shadow:0 0 20px #ff006a,0 0 50px #ff006a,0 0 80px #7a00ff;animation:jedag.32s infinite alternate ease-in-out;position:relative}
.photo-frame img{width:100%;height:100%;object-fit:cover;animation:zoomShake.32s infinite alternate}
.photo-frame::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(255,0,106,.25),transparent 60%);pointer-events:none}
@keyframes jedag{0%{transform:scale(1) rotate(-2deg) translateY(0)}50%{transform:scale(1.08) rotate(1deg) translateY(-8px)}100%{transform:scale(1.15) rotate(-1deg) translateY(4px)}}
@keyframes zoomShake{0%{transform:scale(1.05)}100%{transform:scale(1.18)}}
h1{color:#fff;font-size:38px;font-weight:900;margin-top:16px;letter-spacing:-1px;text-shadow:0 0 10px #ff006a,0 0 20px #ff006a,0 2px 0 #000;animation:textJedag.16s infinite}
@keyframes textJedag{0%{transform:translateX(-2px) skewX(-2deg)}100%{transform:translateX(2px) skewX(2deg)}}
.lyric{color:#ff8fab;font-size:15px;margin-top:4px;font-weight:700;text-shadow:0 0 8px #ff006a;animation:lyricGlow 1s infinite alternate;min-height:22px}
@keyframes lyricGlow{0%{opacity:.7}100%{opacity:1;text-shadow:0 0 12px #fff}}
.tap{color:#fff;font-size:12px;margin-top:14px;opacity:.9;background:rgba(255,255,255,.15);display:inline-block;padding:6px 14px;border-radius:20px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.hearts{position:absolute;inset:0;pointer-events:none;z-index:4}
.heart{position:absolute;bottom:-30px;animation:fly linear forwards;font-size:24px}
@keyframes fly{0%{transform:translateY(0) translateX(0) rotate(0deg) scale(.6);opacity:1}100%{transform:translateY(-110vh) translateX(var(--x)) rotate(720deg) scale(1.5);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10}
.flash.active{animation:flashBeat.18s}
@keyframes flashBeat{0%{opacity:.6}100%{opacity:0}}
.bass{position:absolute;inset:0;border:0 solid #ff006a;pointer-events:none;z-index:6;animation:bassPulse.32s infinite}
@keyframes bassPulse{0%{border-width:0;opacity:0}50%{border-width:18px;opacity:.4}100%{border-width:0;opacity:0}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="vignette"></div>
<div class="bass"></div>
<div class="flash" id="flash"></div>
<div class="hearts" id="hearts"></div>
<div class="container">
<div class="photo-frame"><img src="kia.jpg" alt="Kiaa"></div>
<h1>KIAA 💔</h1>
<div class="lyric" id="lyric">CINTA BAWA DUKA 🎶</div>
<div class="tap" id="tapBtn">🔊 TAP UNTUK MUSIK CINTA BAWA DUKA</div>
</div>
<audio id="music" loop preload="auto">
<source src="https://files.catbox.moe/0r2q8i.mp3" type="audio/mpeg">
</audio>
<iframe id="yt" style="display:none;width:0;height:0" src="" allow="autoplay"></iframe>
<script>
const lyrics=["CINTA BAWA DUKA 🎶","KAU BUAT AKU TERLUKA 💔","CINTA KAU DAN DIA 😭","HANCUR HATIKU 💔","KIAA CANTIK TAPI SEDIH 🥺","CINTA BAWA DUKA 🎵"];
let li=0;
const lyricEl=document.getElementById('lyric');
setInterval(()=>{li=(li+1)%lyrics.length; lyricEl.textContent=lyrics[li];},900);
const hearts=document.getElementById('hearts');
function createHeart(){
 const el=document.createElement('div');el.className='heart';
 const icons=['💔','❤️','😭','💘','🥀','💔'];
 el.textContent=icons[Math.floor(Math.random()*icons.length)];
 el.style.left=Math.random()*100+'vw';
 el.style.setProperty('--x',(Math.random()*100-50)+'px');
 el.style.fontSize=(18+Math.random()*28)+'px';
 el.style.animationDuration=(2+Math.random()*1.5)+'s';
 hearts.appendChild(el);setTimeout(()=>el.remove(),3500);
}
setInterval(createHeart,70);
const flash=document.getElementById('flash');
setInterval(()=>{flash.classList.remove('active'); void flash.offsetWidth; flash.classList.add('active');},320);
let playing=false;
function startMusic(){
 if(playing) return; playing=true;
 document.getElementById('tapBtn').textContent='🎶 CINTA BAWA DUKA - PLAYING 🎶';
 const m=document.getElementById('music');
 m.volume=0.85;
 m.play().catch(()=>{
   document.getElementById('yt').src='https://www.youtube.com/embed/JGw8V0R1_9o?autoplay=1&loop=1';
 });
}
document.body.addEventListener('click',startMusic);
document.body.addEventListener('touchstart',startMusic,{once:true});
</script>
</body>
  </html>
